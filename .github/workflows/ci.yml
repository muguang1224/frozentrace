name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python version matrix on Linux.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Cross-platform check on a stable Python. One job per OS: GitHub-hosted
          # macOS runners are scarce and queue for a long time, so a 5-way macOS
          # matrix can sit pending for 15+ minutes and get cancelled.
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  sdist:
    name: build & test from sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Unpack the sdist and run its own test suite
        run: |
          mkdir _sdist
          tar -xzf dist/*.tar.gz -C _sdist --strip-components=1
          cd _sdist
          python -m pip install -e ".[dev]"
          python -m pytest -q
